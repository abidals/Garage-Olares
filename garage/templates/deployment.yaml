apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: garage
spec:
  replicas: {{ .Values.workloads.garage.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: garage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: garage
    spec:
      enableServiceLinks: false
      initContainers:
        - name: init-permissions
          image: beclab/aboveos-busybox:1.37.0
          command:
            - sh
            - -c
            - |
              for d in /init-data /init-meta; do
                mkdir -p "$d" && chown 1000:1000 "$d"
              done
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: garage-data
              mountPath: /init-data
            - name: garage-meta
              mountPath: /init-meta
      containers:
        - name: garage
          image: docker.io/dxflrs/garage:v2.4.1
          imagePullPolicy: IfNotPresent
          command: ["/garage"]
          args: ["server", "--single-node", "--default-bucket"]
          securityContext:
            runAsUser: 1000
          env:
            - name: TZ
              value: Etc/UTC
            - name: RUST_LOG
              value: garage=info
            - name: GARAGE_DEFAULT_BUCKET
              value: {{ .Values.olaresEnv.GARAGE_DEFAULT_BUCKET | default "garage" | quote }}
            - name: GARAGE_DEFAULT_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-config
                  key: GARAGE_DEFAULT_ACCESS_KEY
            - name: GARAGE_DEFAULT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: garage-config
                  key: GARAGE_DEFAULT_SECRET_KEY
          ports:
            - name: s3
              containerPort: 3900
            - name: admin
              containerPort: 3903
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: garage-data
              mountPath: /var/lib/garage/data
            - name: garage-meta
              mountPath: /var/lib/garage/meta
            - name: garage-config
              mountPath: /etc/garage.toml
              subPath: garage.toml
              readOnly: true
      restartPolicy: Always
      volumes:
        - name: garage-data
          hostPath:
            path: {{ printf "%s/data" .Values.userspace.appData | quote }}
            type: DirectoryOrCreate
        - name: garage-meta
          hostPath:
            path: {{ printf "%s/meta" .Values.userspace.appData | quote }}
            type: DirectoryOrCreate
        - name: garage-config
          secret:
            secretName: garage-config
            items:
              - key: garage.toml
                path: garage.toml
            defaultMode: 0444