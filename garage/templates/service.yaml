apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: '{{ .Release.Namespace }}'
  labels:
    app.kubernetes.io/name: garage
spec:
  selector:
    app.kubernetes.io/name: garage
  ports:
    - name: admin
      port: 3903
      targetPort: 3903