apiVersion: v1
kind: Secret
metadata:
  name: garage-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: garage
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  GARAGE_RPC_SECRET: {{ include "garage.rpcSecret" . | b64enc | quote }}
  GARAGE_DEFAULT_ACCESS_KEY: {{ .Values.olaresEnv.GARAGE_DEFAULT_ACCESS_KEY | default "" | b64enc | quote }}
  GARAGE_DEFAULT_SECRET_KEY: {{ .Values.olaresEnv.GARAGE_DEFAULT_SECRET_KEY | default "" | b64enc | quote }}
stringData:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_secret = "{{ include "garage.rpcSecret" . }}"

    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"

    [admin]
    api_bind_addr = "[::]:3903"
    {{- if .Values.olaresEnv.GARAGE_ADMIN_TOKEN }}
    admin_token = "{{ .Values.olaresEnv.GARAGE_ADMIN_TOKEN }}"
    {{- end }}